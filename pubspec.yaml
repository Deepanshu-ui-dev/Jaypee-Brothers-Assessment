name: fintrack
description: A fully offline personal finance tracker with budgets, analytics, and smart alerts.
publish_to: "none"
version: 1.2.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local Storage (Hive — fully offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.68.0

  # Fonts
  google_fonts: ^6.2.1

  # Shared Preferences (theme, onboarding flag)
  shared_preferences: ^2.2.3

  # Biometric
  local_auth: ^2.3.0

  # Export
  csv: ^6.0.0
  share_plus: ^10.0.3

  # Date/Time
  intl: ^0.19.0

  # Utilities
  collection: ^1.18.0
  uuid: ^4.4.0
  path_provider: ^2.1.3

  # Swipe actions
  flutter_slidable: ^3.1.0

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#04061a"
  adaptive_icon_foreground: "assets/images/app_logo.png"
